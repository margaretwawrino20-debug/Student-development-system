<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
</head>
<body>

    <h1>Student Management System</h1>

    <p>Welcome to my Student Management System.</p>

    <h2>Add Student</h2>

    <form>
        <label>Student Name:</label><br>
        <input type="text" placeholder="Enter student name"><br><br>

        <label>Registration Number:</label><br>
        <input type="text" placeholder="Enter registration number"><br><br>

        <label>Course:</label><br>
        <input type="text" placeholder="Enter course"><br><br>

        <button type="submit">Add Student</button>
    </form>

</body>
</html>
